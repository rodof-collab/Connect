name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: connect
          POSTGRES_PASSWORD: connect
          POSTGRES_DB: connect
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U connect -d connect"
          --health-interval 3s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests && ruff format --check src tests
      - name: Migrations smoke
        env:
          DATABASE_URL: postgresql+psycopg://connect:connect@localhost:5432/connect
          REDIS_URL: redis://localhost:6379/0
          BOT_TOKEN: dummy
          ADMIN_IDS: "1"
        run: alembic upgrade head
      - name: Tests
        env:
          DATABASE_URL: postgresql+psycopg://connect:connect@localhost:5432/connect
          REDIS_URL: redis://localhost:6379/0
          BOT_TOKEN: dummy
          ADMIN_IDS: "1"
        run: pytest

  miniapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci && npm run build
        working-directory: miniapp
